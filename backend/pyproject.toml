[project]
name = "svdv-backend"
version = "0.1.0"
description = "SphereX Viewer and Data Visualizer (SVDV) - NASA Space Apps Challenge 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "astropy>=6.0.0",
    "astroquery>=0.4.7",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "specutils>=1.13.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "supabase>=2.3.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
